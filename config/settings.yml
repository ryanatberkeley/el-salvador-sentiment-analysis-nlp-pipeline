search:
  engine: "serpapi"  # using SerpAPI (Google results)
  results_per_query: 50
  queries:
    # Metal Mining queries
    - "metal mining environmental impact El Salvador site:gov OR site:edu"
    - "minería metálica El Salvador impacto ambiental"
    - "gold mining copper mining El Salvador"
    - "mining pollution water quality El Salvador"
    - "El Salvador mining ban metallic minerals"
    - "El Salvador metal mining ban reversed 2024 protests"
    - "reversión prohibición minería metálica El Salvador"
    - "Nayib Bukele $3 trillion unmined gold El Salvador"
    - "Santa Elena mine El Salvador environmental impact"
    - "El Salvador foreign mining companies investment"
    - "El Salvador mining"
    - "minería El Salvador"
    - "Nayib Bukele mining"
    # Historical context & International lawsuits
    - "OceanaGold Pac Rim lawsuit El Salvador"
    - "El Salvador water crisis mining"
    - "Cabañas water defenders El Salvador"
    
    # Specific environmental impacts
    - "contaminación Río Lempa minería"
    - "defensores del agua El Salvador minería"
    - "El Salvador deforestation metal extraction"
    
    # Economic/Investment angles
    - "Central America mining investment Bukele"
    - "derogación ley contra minería El Salvador"

    # Bitcoin El Salvador queries
    - "Bitcoin El Salvador economic impact"
    - "Bitcoin adoption El Salvador results"
    - "impacto económico Bitcoin El Salvador"
    - "Ley Bitcoin El Salvador evaluación"
    - "El Salvador Bitcoin tourism remittances"
    - "Bitcoin Beach El Salvador analysis"
    - "El Salvador Bitcoin IMF loan $1.4B"
    - "El Salvador removes Bitcoin legal tender status"
    - "Bitcoin City El Salvador foreign investment"
    - "FMI préstamo El Salvador Ley Bitcoin derogación"
    - "El Salvador Bitcoin"
    - "criptomonedas El Salvador"
    - "Chivo wallet El Salvador"
    # Energy & Infrastructure
    - "Volcano bonds El Salvador"
    - "geothermal Bitcoin mining El Salvador"
    - "minería Bitcoin energía geotérmica El Salvador"
    
    # International Finance & Ratings
    - "World Bank El Salvador Bitcoin"
    - "Moody's El Salvador credit rating crypto"
    - "bonos volcán El Salvador"
    
    # Tourism & Daily Use
    - "El Salvador crypto tourism"
    - "turismo cripto El Salvador"
    - "Bukele Bitcoin purchases reserves"

rss:
  enabled: true
  feeds:
    - "https://news.google.com/rss/search?q=El+Salvador+Bitcoin&hl=en-US&gl=US&ceid=US:en"
    - "https://news.google.com/rss/search?q=mining+El+Salvador&hl=en-US&gl=US&ceid=US:en"
    - "https://www.reuters.com/finance/markets/commodities/rss"
    - "https://apnews.com/apf-topnews.rss"

credibility:
  # Trusted domains - high quality sources
  whitelist_domains:
    # International News
    - "reuters.com"
    - "apnews.com"
    - "bbc.com"
    - "nytimes.com"
    - "washingtonpost.com"
    - "theguardian.com"
    - "bloomberg.com"
    - "ft.com"

    # Spanish/Latin American News
    - "elpais.com"
    - "elfaro.net"
    - "laprensagrafica.com"
    - "elsalvador.com"
    - "elmundo.sv"
    - "eldiariodehoy.com"
    - "bnamericas.com"

    # Government & International Organizations
    - "worldbank.org"
    - "imf.org"
    - "un.org"
    - "bcr.gob.sv"
    - "marn.gob.sv"
    - "minec.gob.sv"

    # Academic & Research
    - "jstor.org"
    - "sciencedirect.com"
    - "nature.com"
    - "sciencemag.org"
    - "oxford.ac.uk"
    - "cambridge.org"

    # Crypto & Bitcoin News
    - "coindesk.com"
    - "cointelegraph.com"
    - "bitcoin.com"
    - "decrypt.co"

  # TLD whitelist for additional credibility
  whitelist_tlds:
    - ".gov"
    - ".edu"
    - ".org"
    - ".ac.uk"

  # Minimum article length (characters)
  min_article_len: 500

  # Require HTTPS
  require_https: false  # Some .gov sites still use HTTP

  # Minimum credibility indicators (author, citations, etc)
  min_indicators: 1

  # Minimum credibility score to keep article (0-1)
  min_score: 0.3

crawl:
  user_agent: "ESV-PolicyResearchBot/1.0 (Educational Research; +contact@research.edu)"
  max_per_domain: 100
  timeout_sec: 20
  sleep_sec: 2.0
  max_retries: 2

storage:
  sqlite_path: "data/processed/mining_btc_esv.db"
  csv_path: "data/processed/articles.csv"
  excel_path: "data/processed/articles.xlsx"

nlp:
  # Enable/disable different analyses
  enable_sentiment: true
  enable_stance: true
  enable_summary: true
  enable_language_detection: true

  # Text truncation for performance
  max_text_for_sentiment: 2000
  max_text_for_stance: 1500
  max_text_for_summary: 3000

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "data/scraper.log"
